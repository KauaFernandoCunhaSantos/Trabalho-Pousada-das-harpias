<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta</title>
    <link rel="icon" type="image/x-icon" href="Fotos/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
    <style>
        body {
            background: url('Fotos/pousada.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .card-formulario {
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
        }
    </style>
</head>
<body class="text-white">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4 px-3">
        
        <div class="card-formulario p-4 p-sm-5 shadow-lg">
            <form action="usuario/TelaInicialUsuario.html">
                <h1 class="h2 text-center mb-4 fw-bold">Criar conta</h1>
                
                <!-- Nome -->
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input placeholder="Ex: João Silveira" required type="text" class="form-control" id="nome">
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input placeholder="exemplo@exemplo.com" required type="email" class="form-control" id="email">
                </div> 

                <!-- Linha dupla em telas médias/grandes (Data e CPF) -->
                <div class="row g-3 mb-3">
                    <div class="col-12 col-sm-6">
                        <label for="dataNasc" class="form-label">Data de nascimento</label>
                        <input required type="date" class="form-control" id="dataNasc">
                    </div>
                    <div class="col-12 col-sm-6">
                        <label for="cpf" class="form-label">CPF</label>
                        <input placeholder="000.000.000-00" required type="text" class="form-control" id="cpf">
                    </div>
                </div>

                <!-- Campo Senha 1 -->
                <div class="mb-3">
                    <label for="senha1" class="form-label">Senha</label>
                    <div class="input-group">
                        <input placeholder="Digite sua senha" required type="password" class="form-control" id="senha1">
                        <button class="btn btn-outline-light" type="button" onclick="mostrarSenha('senha1', 'iconeOlho1')" aria-label="Mostrar ou ocultar senha">
                            <i class="bi bi-eye" id="iconeOlho1"></i>
                        </button>
                    </div>
                </div>

                <!-- Campo Senha 2 (Confirmação) -->
                <div class="mb-4">
                    <label for="senha2" class="form-label">Confirmar senha</label>
                    <div class="input-group">
                        <input placeholder="Repita a senha" required type="password" class="form-control" id="senha2">
                        <button class="btn btn-outline-light" type="button" onclick="mostrarSenha('senha2', 'iconeOlho2')" aria-label="Mostrar ou ocultar senha">
                            <i class="bi bi-eye" id="iconeOlho2"></i>
                        </button>
                    </div>
                </div>

                <!-- Botão de Cadastro -->
                <button type="submit" class="btn btn-secondary w-100 py-2 fw-semibold">Cadastrar</button>

                <!-- Link Login -->
                <p class="mt-4 text-center text-white-50 mb-0">
                    Já possui conta? <a href="login.html" class="text-white text-decoration-underline">Entrar</a>
                </p>
            </form>
        </div>  

    </div>  

    <script>
        function mostrarSenha(idInput, idIcone) {
            const inputSenha = document.getElementById(idInput);
            const iconeOlho = document.getElementById(idIcone);
            
            if (inputSenha.type === 'password') {
                inputSenha.type = 'text';
                iconeOlho.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                inputSenha.type = 'password';
                iconeOlho.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }
    </script>
</body>
</html>
