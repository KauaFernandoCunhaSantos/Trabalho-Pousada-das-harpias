<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="Fotos/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"
        defer></script>
</head>
<style>
    body {
        background-image: url(Fotos/pousada.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    .corpo {

        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .formulario {
        backdrop-filter: blur(6px);
        background-color: rgba(0, 0, 0, 0.5);
        padding: 2%;
        border-radius: 8px;
    }
</style>

<body>
    <div class="corpo container min-vh-100 d-flex align-items-center justify-content-center py-4 px-3">
        <div class="formulario p-4 p-sm-5 shadow-lg">
            <form id="formulario">
                <!-- titulo -->
                <h1 class="h1 text-center mb-4 fw-bold">Login</h1>
                <!-- email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input placeholder="exemplo@exemplo.com" required type="email" class="form-control" id="email"
                        aria-describedby="emailHelp">
                </div>
                <!-- senha -->
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <div class="input-group">
                        <input placeholder="Digite sua senha aqui" required type="password" class="form-control"
                            id="senha">
                        <button class="btn btn-outline-light" type="button" id="botaoSenha" onclick="mostrarSenha()">
                            <i class="bi bi-eye" id="iconeOlho"></i>
                        </button>
                    </div>
                </div>
                <div id="mensagemErro"></div>
                <!-- botão para enviar -->
                <button type="button" class="btn btn-secondary w-100  py-2 fw-semibold "
                    onclick="verificar()">Entrar</button>
                <p style="margin-top: 20px; opacity: 0.7; text-align: center;">Não possui conta? <a
                        href="criarConta.html" class="text-light">Criar conta</a></p>
            </form>
        </div>
    </div>
</body>
<script>
    function mostrarSenha() {
        const inputSenha = document.getElementById('senha');
        const iconeOlho = document.getElementById('iconeOlho');

        // Verifica o tipo atual do input e alterna entre password e text
        if (inputSenha.type === 'password') {
            inputSenha.type = 'text';
            iconeOlho.classList.remove('bi-eye');
            iconeOlho.classList.add('bi-eye-slash'); // Muda para o olho cortado
        } else {
            inputSenha.type = 'password';
            iconeOlho.classList.remove('bi-eye-slash');
            iconeOlho.classList.add('bi-eye'); // Volta para o olho normal
        }
    }

    function verificar() {
        const users = [{
            cargo: "adm",
            email: "adm@email.com",
            senha: "321"

        },
        {
            cargo: "usuario",
            email: "user@email.com",
            senha: "123"
        }
        ]
        const emailColocado = document.getElementById("email").value
        const senhaColocada = document.getElementById("senha").value
        const mensagemErro = document.getElementById("mensagemErro")
        if (senhaColocada == users[0].senha && emailColocado == users[0].email) {
            window.location.href = "dashboard/inicioDashboard.html"
            mensagemErro.innerHTML = ""
        }
        else if (senhaColocada == users[1].senha && emailColocado == users[1].email) {
            console.log("dfoi")
            window.location.href = "usuario/TelaInicialUsuario.html"
            mensagemErro.innerHTML = ""
        } else {
            mensagemErro.innerHTML = "Email ou senha incorreto"
        }

    }

</script>

</html>
